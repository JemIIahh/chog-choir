<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15110f" />
    <script>
      // set the mode before first paint so a light-mode visitor never sees a dark flash
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme'), v = localStorage.getItem('chogchoir:theme');
          var t = q === 'light' || q === 'dark' ? q : v === 'light' || v === 'dark' ? v : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <title>Chog Choir</title>
    <meta name="description" content="Every Chog has a voice. Its real traits decide how it sounds. Put Chogs on the staff and hear them sing." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315110f'/%3E%3Cellipse cx='16' cy='17' rx='6' ry='7' fill='%23ffb02e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
